name: Release

# Builds the Windows installer (Study-Copilot-<version>-setup.exe) and attaches it
# to the GitHub release for the tag. Push a tag like v0.3.1, or run this workflow
# by hand and give it an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the installer to (e.g. v0.3.1)"
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Freeze the backend (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller
          python scripts/build_backend.py

      - name: Smoke-test the frozen backend
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "sc-home"
          $env:USERPROFILE = $home_dir
          $env:APPDATA = $home_dir
          New-Item -ItemType Directory -Force $home_dir | Out-Null
          $exe = "build/backend/study-copilot-backend/study-copilot-backend.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--port","8799" -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod http://127.0.0.1:8799/health
              if ($r.status -eq "ok") { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "The frozen backend did not answer /health" }
          "backend ok"

      - name: Build the desktop app and installer (Tauri)
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build

      - name: Name the installer and write a checksum
        id: pack
        shell: pwsh
        run: |
          $src = Get-ChildItem frontend/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $version = $env:TAG.TrimStart("v")
          $name = "Study-Copilot-$version-setup.exe"
          Copy-Item $src.FullName $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$name.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "Study Copilot $($env:TAG.TrimStart('v'))" --generate-notes
          }
          gh release upload $env:TAG "${{ steps.pack.outputs.name }}" "${{ steps.pack.outputs.name }}.sha256" --clobber
