<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" />
    <title>Study Copilot</title>
    <script>
      // Resolve the colour mode before CSS paints to avoid a light/dark flash.
      (function () {
        var saved = {};
        try {
          saved = JSON.parse(localStorage.getItem("study-copilot-appearance") || "{}") || {};
        } catch (e) {}
        var mode = saved.theme || "system";
        var dark = mode === "dark" || (mode !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.palette = typeof saved.palette === "string" ? saved.palette : "clay";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
